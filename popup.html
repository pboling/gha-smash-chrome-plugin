<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: var(--color-fg-default, #e6edf3);
      background: var(--color-canvas-default, #1e2327);
      padding: 16px;
    }
    h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--color-fg-default, #e6edf3);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: var(--color-neutral-muted, #21262d);
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #238636;
    }
    .status-text {
      font-size: 13px;
      color: var(--color-fg-muted, #8b949e);
    }
    .divider {
      height: 1px;
      background: var(--color-border-default, #30363d);
      margin: 16px 0;
    }
    .section {
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-fg-muted, #8b949e);
      margin-bottom: 8px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--color-border-muted, #21262d);
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      color: var(--color-fg-muted, #8b949e);
    }
    .info-value {
      font-family: monospace;
      font-size: 12px;
      color: var(--color-fg-default, #e6edf3);
    }
    .link {
      display: block;
      text-align: center;
      padding: 10px;
      background: var(--color-btn-primary-bg, #238636);
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      transition: background-color 0.2s;
    }
    .link:hover {
      background: var(--color-btn-primary-hover, #2ea043);
    }
    .shortcut {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      background: var(--color-neutral-muted, #21262d);
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
    }
    .kbd {
      padding: 1px 4px;
      background: var(--color-canvas-subtle, #161b22);
      border: 1px solid var(--color-border-default, #30363d);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h2>🔨 GH Advisory Smash</h2>

  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking page...</span>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">How it works</div>
    <div class="info-row">
      <span class="info-label">1. Select</span>
      <span class="info-value">Check 2+ duplicate advisories</span>
    </div>
    <div class="info-row">
      <span class="info-label">2. Smash</span>
      <span class="info-value">Click "Smash" to merge credits</span>
    </div>
    <div class="info-row">
      <span class="info-label">3. Done</span>
      <span class="info-value">Duplicates closed, credits combined</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">Current page</div>
    <div class="info-row">
      <span class="info-label">URL</span>
      <span class="info-value" id="pageUrl">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Selected</span>
      <span class="info-value" id="selectedCount">0</span>
    </div>
  </div>

  <div class="divider"></div>

  <a class="link" href="https://github.com/pboling/gha-smash-chrome-plugin" target="_blank">
    View on GitHub
  </a>

  <div style="margin-top: 12px; text-align: center; font-size: 11px; color: var(--color-fg-muted, #8b949e);">
    <span class="shortcut"><span class="kbd">Alt</span>+<span class="kbd">S</span></span> Quick smash (when button visible)
  </div>

  <script src="popup.js"></script>
</body>
</html>
